name: AzureSpringApps
on: push
env:
  ASC_PACKAGE_PATH: ${{ github.workspace }}
  AZURE_SUBSCRIPTION: '8d751c05-898c-4b1b-a733-26938f28c2f9'

jobs:
  deploy_to_production:
    runs-on: ubuntu-latest
    name: deploy to production with artifact
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v2

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle build, clean
        run: ./gradlew clean build

#      - name: Login via Azure CLI
#        uses: azure/login@v1
#        with:
#          creds: ${{ secrets.AZURE_CREDENTIALS }}
#          enable-AzPSSession: false
#          environment: azurecloud
#          allow-no-subscriptions: false
#          audience: api://AzureADTokenExchange
#          auth-type: SERVICE_PRINCIPAL
#          client-id: ${{ secrets.AZURE_CLIENT_ID }}
#          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: deploy to production with artifact
        uses: azure/spring-apps-deploy@v1
        with:
          azure-subscription: ${{ env.AZURE_SUBSCRIPTION }}
          action: Deploy
          service-name: WorkshopManagement
          app-name: WorkshopManagement
          use-staging-deployment: false
          package: ${{ env.ASC_PACKAGE_PATH }}/build/libs/WorkshopManagement-2.0-SNAPSHOT.jar